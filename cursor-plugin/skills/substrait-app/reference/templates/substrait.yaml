# This file is REQUIRED — a deploy without it (or without a real description)
# fails validation.
#
# App description — what this app does and who it's for (1–3 sentences). Each
# deploy records it onto the app, and it's what teammates see in the portal and
# the platform's API Library, so keep it current as the app evolves. The
# placeholder below must be replaced before the first deploy.
description: >
  Describe your app here: what it does, the data it manages, and who uses it.

# Database — EXPLICIT: the platform provisions a database (and injects
# DATABASE_URL) only when this key is present. Three engines:
#   oceanbase  (default) shared HA cluster, MySQL wire protocol; nightly backups
#              and the portal's Database tab (browse/migrate/repair/reset).
#   postgres   your app's own single-node Postgres pod + 10Gi disk.
#   mysql      your app's own single-node MySQL 8 pod + 10Gi disk.
# The pod engines give you the real engine's semantics, but with NO replication,
# NO platform backups and no Database-tab tooling — pick one only if your app
# actually needs it. The engine cannot be changed after the first deploy.
# The scaffold ships migrations, so it declares a database; if your app truly
# uses none, remove this key AND backend/resources/db/migration/.
database: oceanbase

# Backing services — declare what your app needs and the platform provisions it
# next to the app, injecting the connection env var. Installing a client library
# alone does nothing; this manifest is the only trigger. The three pod services
# are ephemeral by default (pod restart wipes data); add `persistent: true` for a
# disk that survives restarts and redeploys. Leave everything commented out if
# your app needs none of these.
#
# services:
#   redis: {}              # cache/queue      → REDIS_URL=redis://redis:6379/0
#   kafka:                 # Kafka-compatible → KAFKA_BROKERS=kafka:9092
#     persistent: true     #   (single-node Redpanda; 10Gi disk when persistent)
#   qdrant: {}             # vector database  → QDRANT_URL=http://qdrant:6333
#   object-storage: {}     # private file bucket → OBJECT_STORAGE_BUCKET (GCS SDK, signed URLs, no keys)
#
# object-storage takes no options — `persistent` applies only to the three pod
# services. Its bucket is durable storage, not a cache: the files stay put across
# redeploys, and removing the declaration does not delete them.
#
# scaffold_version (optional) — the skill/plugin version this app was built with.
# /substrait:deploy stamps and refreshes it automatically; don't edit it by hand.
